<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Boom - Detalles Creativos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-lila: #f3eaff;
            --primary-lila: #9d72d9;
            --soft-lila: #e8d9ff;
            --deep-purple: #623697;
            --whatsapp-green: #25d366;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-lila);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-lila);
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .logo-box {
            width: 100px; height: 100px;
            background-color: var(--white);
            border: 3px solid var(--primary-lila);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(157, 114, 217, 0.2);
            margin-bottom: 15px;
        }

        .logo-box i { font-size: 50px; color: var(--deep-purple); }
        .brand-title { margin: 0; font-size: 38px; font-weight: 900; color: var(--deep-purple); text-transform: uppercase; }
        .slogan { font-size: 14px; color: var(--deep-purple); font-weight: 700; letter-spacing: 3px; margin-top: 8px; text-transform: uppercase; }

        /* --- Filtros --- */
        .category-bar {
            display: flex; gap: 10px; justify-content: center; margin: 20px 0 30px;
            overflow-x: auto; padding: 5px; scrollbar-width: none;
        }

        .cat-btn {
            background: var(--soft-lila); padding: 10px 22px; border-radius: 20px;
            border: none; font-weight: 700; cursor: pointer; transition: 0.3s; color: var(--deep-purple);
            white-space: nowrap;
        }

        .cat-btn.active { background: var(--primary-lila); color: white; }

        /* --- Grid de Productos --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
        }

        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        .card {
            background: var(--white); border-radius: 25px; padding: 15px;
            text-align: center; box-shadow: 0 8px 20px rgba(123, 79, 182, 0.08);
            border: 1px solid var(--soft-lila); cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column;
        }

        .card:hover { transform: translateY(-5px); }
        .card.hidden { display: none !important; }

        .img-space { 
            background: var(--bg-lila); 
            height: 120px; 
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 10px;
            overflow: hidden; 
        }

        .img-space i { font-size: 40px; color: var(--primary-lila); }
        .img-space img { width: 100%; height: 100%; object-fit: cover; }

        .price-tag { color: var(--deep-purple); font-weight: 800; font-size: 17px; margin: 5px 0 0 0; }
        h3 { font-size: 16px; margin: 5px 0; color: #333; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: none;
            justify-content: center; align-items: center; z-index: 10000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white; width: 90%; max-width: 400px;
            padding: 30px; border-radius: 30px; text-align: center;
            position: relative; animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 25px; cursor: pointer; color: var(--deep-purple); }
        
        .modal-media-container {
            width: 120px; height: 120px;
            background: var(--bg-lila);
            margin: 0 auto 15px;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .modal-media-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-media-container i { font-size: 50px; color: var(--primary-lila); }

        .modal-title { color: var(--deep-purple); margin: 0; font-size: 24px; }
        .modal-description { color: #666; font-size: 14px; margin: 15px 0; line-height: 1.5; }
        .modal-price { font-size: 22px; font-weight: 800; color: var(--primary-lila); margin-bottom: 20px; }

        /* --- FOOTER --- */
        footer {
            margin-top: 50px; padding: 25px 0;
            border-top: 2px solid var(--soft-lila);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .contact-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .contact-item {
            text-decoration: none; color: var(--white); font-weight: 600;
            display: flex; align-items: center; gap: 8px; font-size: 13px;
            background: var(--primary-lila); padding: 10px 18px; border-radius: 25px;
            transition: 0.3s;
        }

        .wa-btn {
            position: fixed; bottom: 25px; right: 25px;
            background: var(--whatsapp-green); color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none; z-index: 999;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header-container">
        <div class="logo-box"><i class="fa-solid fa-cat"></i></div>
        <h1 class="brand-title">Studio Boom</h1>
        <span class="slogan">Detalles Creativos</span>
    </div>

    <div class="category-bar">
        <button class="cat-btn active" onclick="filter('all', this)">Todos</button>
        <button class="cat-btn" onclick="filter('amor', this)">Con Amor</button>
        <button class="cat-btn" onclick="filter('marcacion', this)">Marcación</button>
        <button class="cat-btn" onclick="filter('stickers', this)">Stickers</button>
        <button class="cat-btn" onclick="filter('papeleria', this)">Papelería</button>
    </div>

    <div class="grid">
        <div class="card" data-cat="amor" onclick="showDetails('Álbum Cromos', 'Álbum cromos personalizado, tamaño 16x23.5cm, 28 paginas, 48 fichas distribuidas en 6 sobres', '$55.000', 'album_valentin.png')">
            <div class="img-space">
                <img src="album_valentin.png" alt="Álbum Cromos">
            </div>
            <h3>Álbum Cromos</h3>
            <p class="price-tag">$55.000</p>
        </div>
        
        <div class="card" data-cat="amor" onclick="showDetails('Retablos Boom', 'Creamos retablos únicos que llenan de vida cualquier espacio.', '$25.000', 'fa-wand-magic-sparkles')">
            <div class="img-space"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <h3>Retablos Boom</h3>
            <p class="price-tag">$25.000</p>
        </div>

        <div class="card" data-cat="papeleria" onclick="showDetails('Tarjetas', 'Millar de tarjetas plastificadas mate y brillo uv, medida 9x5.4 cm. (Este valor no incluye diseño)', '$80.000', 'fa-address-card')">
            <div class="img-space"><i class="fa-solid fa-address-card"></i></div>
            <h3>Tarjetas Mate</h3>
            <p class="price-tag">$80.000</p>
        </div>

        <div class="card" data-cat="marcacion" onclick="showDetails('Termos', 'Personaliza tu termo con marcado láser y lleva contigo algo realmente significativo.', '$35.000', 'fa-bottle-water')">
            <div class="img-space"><i class="fa-solid fa-bottle-water"></i></div>
            <h3>Termos</h3>
            <p class="price-tag">$35.000</p>
        </div>

        <div class="card" data-cat="marcacion" onclick="showDetails('Mug Boom', 'Mug de cerámica (11oz), marcado en sublimación.', '$15.000', 'fa-mug-hot')">
            <div class="img-space"><i class="fa-solid fa-mug-hot"></i></div>
            <h3>Mug Boom</h3>
            <p class="price-tag">$15.000</p>
        </div>

        <div class="card" data-cat="stickers" onclick="showDetails('Pack Stickers', 'Paquete de 10 stickers en vinilo Adhesivo, medida aprox. 8x8 cm.', '$6.000', 'fa-face-grin-hearts')">
            <div class="img-space"><i class="fa-solid fa-face-grin-hearts"></i></div>
            <h3>Pack Stickers</h3>
            <p class="price-tag">$6.000</p>
        </div>
    </div>

    <footer>
        <div class="contact-links">
            <a href="tel:+573202217412" class="contact-item">
                <i class="fa-solid fa-phone"></i> +57 3202217412
            </a>
            <a href="https://instagram.com/studio_boom__" target="_blank" class="contact-item">
                <i class="fa-brands fa-instagram"></i> @studio_boom__
            </a>
        </div>
        <p style="font-size: 11px; color: var(--deep-purple); font-weight: bold; margin-top: 10px;">©️ 2026 Studio Boom</p>
    </footer>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeDetails()">&times;</span>
        <div class="modal-media-container" id="modal-media-content">
            </div>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-description" id="modal-desc"></p>
        <p class="modal-price" id="modal-price"></p>
        <a id="modal-wa-link" href="#" target="_blank" class="contact-item" style="justify-content: center; background: var(--whatsapp-green);">
            <i class="fa-brands fa-whatsapp"></i> Preguntar disponibilidad
        </a>
    </div>
</div>

<a href="https://wa.me/573202217412" class="wa-btn" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
    function filter(category, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.card').forEach(card => {
            if (category === 'all' || card.getAttribute('data-cat') === category) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function showDetails(title, desc, price, media) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('modal-price').innerText = price;
        
        const mediaContainer = document.getElementById('modal-media-content');
        
        // LÓGICA PARA DETECTAR SI ES IMAGEN O ICONO
        if (media.includes('.') || media.startsWith('http')) {
            // Es una imagen (tiene punto como .png o .jpg)
            mediaContainer.innerHTML = `<img src="${media}" alt="${title}">`;
        } else {
            // Es un icono de FontAwesome
            mediaContainer.innerHTML = `<i class="fa-solid ${media}"></i>`;
        }

        // Link de WhatsApp personalizado
        const textoWa = encodeURIComponent(`¡Hola Studio Boom! Me interesa el producto: ${title}`);
        document.getElementById('modal-wa-link').href = `https://wa.me/573202217412?text=${textoWa}`;

        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function closeDetails() {
        closeModal();
    }

    window.onclick = function(event) {
        let modal = document.getElementById('modal');
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
